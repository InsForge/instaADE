name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test

  windows:
    runs-on: windows-latest
    defaults:
      run:
        # bash stops at the first failing command; PowerShell would not.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      # clippy and the Rust build embed the front end, so it is built first.
      - run: bun run build
      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo clippy -- -D warnings
          cargo test
      # The updater key lives only in the release environment, so CI signs no updater files.
      - run: bun tauri build --bundles nsis --no-sign
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: instabox-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
