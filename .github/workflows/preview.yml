name: Preview build

# Stage one of a preview. When a pull request gets the preview-build label, this builds
# Instabox Preview from it. It has no secrets and signs nothing. Preview publish (stage two)
# runs only main's code: it checks the author, signs and notarizes the build, and publishes it.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  # An unrelated label skips the build and must not cancel one.
  cancel-in-progress: ${{ github.event.label.name == 'preview-build' }}

jobs:
  # Preview publish reads which pull request this run built, instead of guessing it from the
  # commit, which several pull requests may share.
  pull-request:
    if: github.event.label.name == 'preview-build'
    runs-on: ubuntu-latest
    steps:
      - name: Record the pull request
        env:
          PR: ${{ github.event.pull_request.number }}
        run: printf '%s' "$PR" > "$RUNNER_TEMP/pr.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-pr
          path: ${{ runner.temp }}/pr.txt
          if-no-files-found: error
          retention-days: 1

  build:
    if: github.event.label.name == 'preview-build'
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: preview-${{ matrix.target }}
      - run: bun install --frozen-lockfile
      - name: Build the unsigned app
        if: runner.os == 'macOS'
        run: |
          bun tauri build --target ${{ matrix.target }} --bundles app --no-sign --config src-tauri/tauri.preview.conf.json
          ditto -c -k --keepParent "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Instabox Preview.app" "$RUNNER_TEMP/preview.zip"
      # The Windows installer is not signed yet: SmartScreen asks once before it runs.
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bun tauri build --target ${{ matrix.target }} --bundles nsis --config src-tauri/tauri.preview.conf.json
          files=(src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe)
          if [ ${#files[@]} -ne 1 ]; then
            echo "expected one installer, found ${#files[@]}" >&2
            exit 1
          fi
          cp "${files[0]}" "$RUNNER_TEMP/preview.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-${{ matrix.target }}
          path: ${{ runner.temp }}/${{ runner.os == 'Windows' && 'preview.exe' || 'preview.zip' }}
          if-no-files-found: error
          retention-days: 1
