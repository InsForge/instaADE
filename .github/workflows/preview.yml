name: Preview build

# A signed and notarized Instabox Preview from any branch, to try a change before a release.
# It installs next to Instabox. Run it from the Actions tab, or add the `preview-build` label
# to a pull request. Each run waits for a maintainer to approve the `preview` environment.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'preview-build'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      environment: preview
      preview: true

  comment:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Link the build on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Instabox Preview for ${SHA::7} is ready. Download it under Artifacts at $RUN. The files are kept for 14 days. Remove the preview-build label and add it again to build a newer commit."
